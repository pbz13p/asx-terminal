<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Terminal · ASX</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#05060C;--p:#0A0D18;--p2:#0E1222;--ln:#161D35;--ln2:#222B4D;--ink:#E6ECFF;--mu:#8590B8;--mu2:#5B6690;--c:#22E4F5;--up:#19FF9C;--dn:#FF2E74;--y:#FFD43B;--v:#A44BFF;
--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--disp:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--mono)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.y{color:var(--y)}
#app{display:grid;grid-template-rows:46px 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,#0A0D1C,#06070E);position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,228,245,.55),rgba(164,75,255,.45),transparent)}
.brand{font:700 15px var(--disp);letter-spacing:.04em;white-space:nowrap}.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);margin-right:8px}
.brand b{color:var(--c);font-weight:700}
#sf input{width:220px;height:30px;background:var(--p2);border:1px solid var(--ln2);border-radius:6px;padding:0 10px;text-transform:uppercase}
#sf input:focus{outline:none;border-color:var(--c);box-shadow:0 0 10px rgba(34,228,245,.3)}#sf input::placeholder{text-transform:none;color:var(--mu2)}
.idx{display:flex;gap:18px;overflow:hidden;white-space:nowrap;flex:1}.idx div{display:flex;gap:6px;align-items:baseline}.idx small{color:var(--mu)}
.hb{display:flex;gap:8px;align-items:center;white-space:nowrap}
.btn{all:unset;cursor:pointer;padding:4px 10px;border:1px solid var(--ln2);border-radius:6px;color:var(--mu);font-size:12px}.btn:hover{color:var(--ink);border-color:var(--c)}
.btn.on,.tf.on{color:#03050A;background:var(--c);border-color:var(--c);box-shadow:0 0 10px rgba(34,228,245,.35)}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;min-height:0}
aside,#center{min-height:0;display:flex;flex-direction:column}
aside{background:var(--p);border-right:1px solid var(--ln)}aside.r{border-right:0;border-left:1px solid var(--ln);overflow-y:auto}
.tabs{display:flex;border-bottom:1px solid var(--ln);flex:none}.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 0;color:var(--mu);font-size:12px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--c)}
.list{overflow-y:auto;flex:1}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 12px;border-bottom:1px solid #0F1428;cursor:pointer;position:relative}
.it:hover{background:#0F1430}.it.on{background:#101838;box-shadow:inset 2px 0 0 var(--c)}
.it b{font-weight:700}.it .nm{grid-column:1;color:var(--mu2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .r{text-align:right}
.it .x{position:absolute;right:4px;top:2px;all:unset;cursor:pointer;color:var(--mu2);font-size:11px;padding:0 4px;display:none}.it:hover .x{display:block}
.it .tag{font-size:10.5px;color:var(--y)}
.add{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--ln);flex:none}.add input{flex:1;height:28px;background:var(--p2);border:1px solid var(--ln2);border-radius:6px;padding:0 8px;text-transform:uppercase}
#center{background:var(--bg)}
.sym{display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--ln);flex:none;flex-wrap:wrap}
.sym h2{margin:0;font:700 20px var(--disp)}.sym .px{font:700 20px var(--disp)}.sym .nmx{color:var(--mu);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}.tf{all:unset;cursor:pointer;padding:3px 8px;border:1px solid var(--ln2);border-radius:5px;color:var(--mu);font-size:12px}
.tool select{background:var(--p2);border:1px solid var(--ln2);border-radius:5px;height:24px;padding:0 4px;color:var(--mu)}
.sep{width:1px;height:18px;background:var(--ln2);margin:0 4px}
#chart{flex:1;min-height:240px;position:relative}#sub{height:150px;flex:none;border-top:1px solid var(--ln)}
#legend{position:absolute;left:12px;top:6px;z-index:3;font-size:11.5px;color:var(--mu);pointer-events:none}
#note{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mu);z-index:2}
.bottom{height:260px;flex:none;border-top:1px solid var(--ln);display:flex;flex-direction:column;background:var(--p)}
.bottom .tabs button{flex:none;padding:8px 14px}
.tbl{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:var(--p);color:var(--mu2);font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid var(--ln)}
td{padding:5px 10px;border-bottom:1px solid #0F1428;white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover td{background:#0F1430}
td.w{white-space:normal;min-width:260px}
.find{padding:10px 14px;font-size:12.5px;line-height:1.65}.find h4{margin:12px 0 4px;color:var(--c);font-size:12.5px}.find p{margin:2px 0;color:#C6CEEE}
.sec{padding:12px 14px;border-bottom:1px solid var(--ln)}.sec h3{margin:0 0 8px;font:500 11.5px var(--mono);color:var(--mu2);letter-spacing:.1em}
.big{font:700 28px var(--disp)}.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}.chips div{background:var(--p2);border-radius:5px;padding:4px 6px;text-align:center}.chips small{display:block;color:var(--mu2);font-size:10.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kv div{background:var(--p2);border-radius:6px;padding:6px 8px}.kv small{display:block;color:var(--mu2);font-size:10.5px}.kv b{font-weight:700}
.sig{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #0F1428}.sig i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px}.sig b{display:block;font-size:12.5px}.sig p{margin:2px 0 0;color:#B9C2E6;font-size:12px;line-height:1.5}
.ann{padding:7px 0;border-bottom:1px solid #0F1428;cursor:pointer}.ann:hover{background:#0F1430}.ann small{color:var(--mu2)}.ann .ps{color:var(--dn);font-size:10.5px;border:1px solid var(--dn);border-radius:3px;padding:0 3px;margin-right:4px}
.empty{color:var(--mu2);padding:10px 0}
#dr{position:fixed;top:46px;right:0;bottom:0;width:min(620px,100vw);background:#0A0D18;border-left:1px solid #22E4F5;box-shadow:-10px 0 40px rgba(34,228,245,.18);transform:translateX(105%);transition:transform .25s;z-index:50;display:flex;flex-direction:column}
#dr.on{transform:none}#dr .dh{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}#dr .dh b{flex:1;font-size:13px}
#dr .db{overflow-y:auto;padding:14px 18px;font:14px/1.8 "Segoe UI",system-ui,sans-serif;color:#DCE3FF}#dr .db p{margin:0 0 10px}#dr .db .en{color:#8590B8;font-size:13px;border-top:1px dashed var(--ln2);margin-top:14px;padding-top:12px}
.ann .tr{all:unset;cursor:pointer;float:right;margin-left:6px;padding:0 6px;border:1px solid var(--ln2);border-radius:4px;color:var(--c);font-size:11px}.ann .tr:hover{border-color:var(--c)}
#rc{position:fixed;top:46px;left:0;right:0;bottom:0;background:rgba(5,6,12,.97);z-index:40;display:none;overflow-y:auto;padding:16px 22px 40px}
#rc.on{display:block}.rch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}.rch h2{margin:0;font:700 20px var(--disp)}
.rcs{display:flex;gap:10px}.rcs div{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 12px}.rcs b{font:700 18px var(--disp);margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.cd{background:linear-gradient(160deg,#0D1124,#080A15);border:1px solid var(--ln2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cd.ok{border-color:rgba(25,255,156,.45);box-shadow:0 0 14px rgba(25,255,156,.08)}.cd.bad{opacity:.72}.cd.tool{border-color:rgba(34,228,245,.4)}
.cd h4{margin:0;font:700 15px var(--disp);display:flex;gap:8px;align-items:center}.vd{font:500 11px var(--mono);padding:1px 7px;border-radius:9px;border:1px solid}
.vd.ok{color:var(--up)}.vd.bad{color:var(--dn)}.vd.tool{color:var(--c)}.vd.mid{color:var(--y)}
.cd .rl{color:#C6CEEE;font-size:12.5px;line-height:1.6}.cd .us{color:var(--y);font-size:12.5px;line-height:1.6}
.nums{display:flex;flex-wrap:wrap;gap:6px}.nums span{background:var(--p2);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--mu)}.nums b{color:var(--ink);margin-left:4px}
.hits{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}.hits button{all:unset;cursor:pointer;padding:2px 8px;border-radius:5px;background:#10183A;border:1px solid #23306A;font-size:12px}.hits button:hover{border-color:var(--c)}
.cd .ft{color:var(--mu2);font-size:11px;margin-top:auto}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1A2244;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:1100px){main{grid-template-columns:1fr}aside{max-height:260px}aside.r{max-height:none}#app{height:auto}#chart{height:380px;flex:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><i></i>NEON <b>TERMINAL</b></div>
  <form id="sf" role="search"><input id="si" placeholder="搜索代码，如 CND" maxlength="6" autocomplete="off" aria-label="搜索股票代码"></form>
  <div class="idx num" id="idx"></div>
  <div class="hb"><span class="mu" id="breadth"></span><button class="btn" id="rcb" style="color:#19FF9C;border-color:rgba(25,255,156,.5)">🔬 研究中心</button><a class="btn" href="/report.html" target="_blank">完整报告</a><a class="btn" href="/classic.html">经典版</a><span class="mu" id="src" style="font-size:11px"></span></div>
</header>
<main>
  <aside>
    <div class="tabs" id="ltabs"><button data-t="watch" class="on">自选</button><button data-t="gain">涨幅</button><button data-t="lose">跌幅</button><button data-t="sig">信号</button></div>
    <div class="list" id="list"></div>
    <form class="add" id="addf"><input id="addi" placeholder="加自选，如 BHP" maxlength="6" aria-label="添加自选股"><button class="btn">添加</button></form>
  </aside>
  <section id="center">
    <div class="sym">
      <h2 id="code">—</h2><span class="nmx" id="name"></span><span class="px num" id="px"></span><span class="num" id="chg"></span>
      <div class="tool">
        <span id="tfs"></span><span class="sep"></span>
        <button class="tf on" data-ma="20">MA20</button><button class="tf on" data-ma="50">MA50</button><button class="tf on" data-ma="200">MA200</button><span class="sep"></span>
        <select id="subsel" aria-label="副图指标"><option value="rsi">RSI</option><option value="macd">MACD</option><option value="kdj">KDJ</option><option value="none">无副图</option></select>
      </div>
    </div>
    <div id="chart"><div id="legend"></div><div id="note"></div></div>
    <div id="sub"></div>
    <div class="bottom">
      <div class="tabs" id="btabs"><button data-t="rockets" class="on">爆拉候选</button><button data-t="breakouts">放量突破</button><button data-t="watchalerts">自选提醒</button><button data-t="mkt">市场公告</button><button data-t="find">研究结论</button></div>
      <div class="tbl" id="btbl"></div>
    </div>
  </section>
  <aside class="r" id="right">
    <div class="sec"><h3>概况</h3><div class="big num" id="rpx">—</div><div id="rname" class="mu"></div><div class="chips num" id="rchg"></div></div>
    <div class="sec"><h3>关键数据</h3><div class="kv num" id="rkv"></div></div>
    <div class="sec"><h3>我们的研究</h3><div id="rres"></div></div>
    <div class="sec"><h3>最新公告 <span class="mu" style="font-size:10.5px">· 点开可翻译成中文</span></h3><div id="rann"></div></div>
  </aside>
</main>
</div>
<div id="rc" role="dialog" aria-label="研究中心"><div class="rch"><h2>🔬 研究中心</h2><div class="rcs num" id="rcs"></div><div class="tabs" id="rcf" style="border:0;white-space:nowrap"><button data-f="all" class="on">全部</button><button data-f="ASX">澳股</button><button data-f="A股">A 股</button><button data-f="无效">测过无效</button></div><span style="flex:1"></span><button class="btn" id="rcx">关闭 ✕</button></div><div class="cards" id="rcc"></div></div>
<div id="dr" role="dialog" aria-label="公告"><div class="dh"><b id="drt"></b><button class="btn" id="dro">原文页</button><button class="btn" id="drx" aria-label="关闭">✕</button></div><div class="db" id="drb"></div></div>
<script>
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
async function api(p){var r=await fetch('/api/'+p);var j=await r.json();if(!j.ok)throw new Error(j.error||'出错');return j.data;}
function pc(v,d){if(v==null||isNaN(v))return '<span class="mu">—</span>';d=d==null?1:d;return '<span class="'+(v>=0?'up':'dn')+'">'+(v>=0?'+':'')+v.toFixed(d)+'%</span>';}
function px(v){if(v==null)return '—';return v<0.1?v.toFixed(4):v<2?v.toFixed(3):v.toFixed(2);}
function mc(v){return v?'$'+(v>=1e9?(v/1e9).toFixed(1)+'B':(v/1e6).toFixed(0)+'M'):'—';}
var SZ={'Information Technology':'信息技术','Industrials':'工业','Financials':'金融','Real Estate':'房地产','Materials':'原材料/矿业','Communication Services':'通信','Health Care':'医疗','Consumer Discretionary':'可选消费','Consumer Staples':'必需消费','Energy':'能源','Utilities':'公用事业'};
var st={sel:null,tf:'6M',ma:{20:1,50:1,200:1},sub:'rsi',lt:'watch',bt:'rockets',watch:[]};
try{st.watch=JSON.parse(localStorage.getItem('nt_watch')||'null')||['CND','BHP','CBA','PLS','XRO'];st.sub=localStorage.getItem('nt_sub')||'rsi';}catch(e){st.watch=['CND','BHP','CBA','PLS','XRO'];}
function saveW(){try{localStorage.setItem('nt_watch',JSON.stringify(st.watch));}catch(e){}}
var Q={},MKT=[],SCAN=null,NAMES={};

/* ---------- chart ---------- */
var LC=window.LightweightCharts,chart,sub,cs,vs,mas={},subs=[];
var CO={layout:{background:{color:'#05060C'},textColor:'#8590B8',fontFamily:'JetBrains Mono'},grid:{vertLines:{color:'#0E1328'},horzLines:{color:'#0E1328'}},
 rightPriceScale:{borderColor:'#161D35'},timeScale:{borderColor:'#161D35',timeVisible:true,secondsVisible:false},crosshair:{mode:0,vertLine:{color:'#2A3570'},horzLine:{color:'#2A3570'}}};
function mkCharts(){
 chart=LC.createChart($('chart'),Object.assign({autoSize:true},CO));
 cs=chart.addCandlestickSeries({upColor:'#19FF9C',downColor:'#FF2E74',borderVisible:false,wickUpColor:'#19FF9C',wickDownColor:'#FF2E74'});
 vs=chart.addHistogramSeries({priceScaleId:'',priceFormat:{type:'volume'},lastValueVisible:false,priceLineVisible:false});
 vs.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
 var col={20:'#FFD43B',50:'#22E4F5',200:'#A44BFF'};
 [20,50,200].forEach(function(n){mas[n]=chart.addLineSeries({color:col[n],lineWidth:1.4,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});});
 sub=LC.createChart($('sub'),Object.assign({autoSize:true},CO,{timeScale:{visible:false,borderColor:'#161D35'}}));
 chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(r)sub.timeScale().setVisibleLogicalRange(r);});
 chart.subscribeCrosshairMove(function(p){var d=p&&p.seriesData&&p.seriesData.get(cs);if(!d){legend();return;}legend(d);});
}
var BARS=[];
function tkey(t){if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;var s=Date.parse(String(t).replace(' ','T')+(String(t).length<=19?'Z':''));return Math.floor(s/1000)+11*3600;}
function sma(a,n){var o=[],s=0;for(var i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];o.push(i>=n-1?s/n:null);}return o;}
function ema(a,n){var o=[],k=2/(n+1),e=null;for(var i=0;i<a.length;i++){e=e==null?a[i]:e+k*(a[i]-e);o.push(e);}return o;}
function legend(d){var b=d||BARS[BARS.length-1];if(!b){$('legend').textContent='';return;}$('legend').innerHTML='开 '+px(b.open)+' 高 '+px(b.high)+' 低 '+px(b.low)+' 收 <b style="color:#E6ECFF">'+px(b.close)+'</b>'+(st.ma[20]?' <span style="color:#FFD43B">MA20</span>':'')+(st.ma[50]?' <span style="color:#22E4F5">MA50</span>':'')+(st.ma[200]?' <span style="color:#A44BFF">MA200</span>':'');}
function draw(){
 var b=BARS,c=b.map(function(x){return x.close;}),lp=c.length?c[c.length-1]:1,pr=lp<0.1?4:lp<2?3:2,pf={type:'price',precision:pr,minMove:Math.pow(10,-pr)};
 cs.applyOptions({priceFormat:pf});[20,50,200].forEach(function(n){mas[n].applyOptions({priceFormat:pf});});
 cs.setData(b);vs.setData(b.map(function(x){return {time:x.time,value:x.v,color:x.close>=x.open?'rgba(25,255,156,.28)':'rgba(255,46,116,.28)'};}));
 [20,50,200].forEach(function(n){var m=sma(c,n);mas[n].setData(st.ma[n]?b.map(function(x,i){return m[i]==null?null:{time:x.time,value:m[i]};}).filter(Boolean):[]);});
 subs.forEach(function(s){sub.removeSeries(s);});subs=[];
 $('sub').style.display=st.sub==='none'?'none':'';
 if(st.sub==='rsi'){var r=rsi(c,14),s=sub.addLineSeries({color:'#22E4F5',lineWidth:1.4,priceLineVisible:false});s.setData(b.map(function(x,i){return r[i]==null?null:{time:x.time,value:r[i]};}).filter(Boolean));
   s.createPriceLine({price:70,color:'#FF2E74',lineStyle:2,lineWidth:1,axisLabelVisible:false});s.createPriceLine({price:30,color:'#19FF9C',lineStyle:2,lineWidth:1,axisLabelVisible:false});subs.push(s);}
 if(st.sub==='macd'){var e1=ema(c,12),e2=ema(c,26),m=e1.map(function(v,i){return v-e2[i];}),sg=ema(m,9);
   var mf={type:'price',precision:pr+1,minMove:Math.pow(10,-pr-1)};var h=sub.addHistogramSeries({priceLineVisible:false,lastValueVisible:false,priceFormat:mf});h.setData(b.map(function(x,i){var v=m[i]-sg[i];return {time:x.time,value:v,color:v>=0?'rgba(25,255,156,.6)':'rgba(255,46,116,.6)'};}));
   var l1=sub.addLineSeries({color:'#FFD43B',lineWidth:1.2,priceLineVisible:false,priceFormat:mf}),l2=sub.addLineSeries({color:'#22E4F5',lineWidth:1.2,priceLineVisible:false,priceFormat:mf});
   l1.setData(b.map(function(x,i){return {time:x.time,value:m[i]};}));l2.setData(b.map(function(x,i){return {time:x.time,value:sg[i]};}));subs.push(h,l1,l2);}
 if(st.sub==='kdj'){var K=[],D=[],J=[],k=50,dd=50;for(var i=0;i<b.length;i++){var lo=Infinity,hi=-Infinity;for(var j=Math.max(0,i-8);j<=i;j++){lo=Math.min(lo,b[j].low);hi=Math.max(hi,b[j].high);}var rsv=hi>lo?100*(b[i].close-lo)/(hi-lo):50;k=k+(rsv-k)/3;dd=dd+(k-dd)/3;K.push(k);D.push(dd);J.push(3*k-2*dd);}
   [[K,'#FFD43B'],[D,'#22E4F5'],[J,'#A44BFF']].forEach(function(p){var s=sub.addLineSeries({color:p[1],lineWidth:1.2,priceLineVisible:false});s.setData(b.map(function(x,i){return {time:x.time,value:p[0][i]};}));subs.push(s);});}
 chart.timeScale().fitContent();legend();
}
