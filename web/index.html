<style>

.it .tag{font-size:14.5px;color:var(--y)}

#note{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mu);z-index:2}
.bottom{height:260px;flex:none;border-top:1px solid var(--ln);display:flex;flex-direction:column;background:var(--p)}
.bottom .tabs button{flex:none;padding:8px 14px}
.tbl{overflow:auto;flex:1}

td{padding:5px 10px;border-bottom:1px solid #0F1428;white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover td{background:#0F1430}

.ann{padding:7px 0;border-bottom:1px solid #0F1428;cursor:pointer}.ann:hover{background:#0F1430}.ann small{color:var(--mu2)}.ann .ps{color:var(--dn);font-size:14.5px;border:1px solid var(--dn);border-radius:3px;padding:0 3px;margin-right:4px}

.rcs{display:flex;gap:10px}.rcs div{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 12px}.rcs b{font:700 20px var(--disp);margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}#rc{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}#rc .cd .rl,#rc .cd .us,#rc .nums span,#rc #rcn div{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;font-weight:500}
.cd{background:linear-gradient(160deg,#0D1124,#080A15);border:1px solid var(--ln2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cd.ok{border-color:rgba(25,255,156,.45);box-shadow:0 0 14px rgba(25,255,156,.08)}.cd.bad{opacity:.85}.cd.tool{border-color:rgba(34,228,245,.4)}
.cd h4{margin:0;font:700 20.5px var(--disp);display:flex;gap:8px;align-items:center}.vd{font:500 15.5px var(--mono);padding:1px 7px;border-radius:9px;border:1px solid}
.vd.ok{color:var(--up)}.vd.bad{color:var(--dn)}.vd.tool{color:var(--c)}.vd.mid{color:var(--y)}
.vd.t-weak{color:var(--y)}.vd.t-backtest{color:var(--c)}.vd.t-live_ok{color:var(--up);background:rgba(25,255,156,.12)}.vd.t-live_fail{color:var(--dn)}.vd.t-bad{color:var(--dn)}.vd.t-tool{color:var(--mu,#8892b8)}.ev{font-size:16.5px;color:#C9D2F5;margin-top:6px}
.cd .rl{color:#F2F5FF;font-size:18.5px;line-height:1.7}.cd .us{color:#FFE066;font-size:18.5px;line-height:1.7}
.nums{display:flex;flex-wrap:wrap;gap:6px}.nums span{background:#141A33;border:1px solid #33407A;border-radius:6px;padding:5px 10px;font-size:17.5px;color:#DCE3FF}.nums b{color:#FFFFFF;margin-left:4px}
.hits{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}.hits button{all:unset;cursor:pointer;padding:3px 9px;border-radius:5px;background:#10183A;border:1px solid #2E3D80;font-size:17.5px;color:#FFFFFF}.hits button:hover{border-color:var(--c)}
.cd .ft{color:#C3CCEE;font-size:16.5px;margin-top:auto}

#nw{position:fixed;top:46px;left:0;right:0;bottom:0;background:#05060C;z-index:40;display:none;overflow-y:auto;padding:16px 22px 40px;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif}#nw.on{display:block}
#nwf button{all:unset;cursor:pointer;padding:4px 12px;margin-right:4px;border:1px solid #2E3D80;border-radius:6px;color:#DCE3FF;font-size:17px}#nwf button.on{color:#05060C;background:#FFD23F;border-color:#FFD23F;font-weight:700}
#nwl{max-width:1100px}.nwi{background:#0A0D18;border:1px solid #222B4D;border-radius:10px;padding:14px 18px;margin-bottom:12px}.nwi.new{border-color:rgba(255,210,63,.7);box-shadow:0 0 18px rgba(255,210,63,.12)}

<body>
<div id="app">
<header>
  <div class="brand"><i></i>NEON <b>TERMINAL</b></div><div class="mk" id="mkt"><button data-m="au" class="on">🇦🇺 澳股</button><button data-m="cn">🇨🇳 A 股</button><button data-m="cx">₿ 加密</button><button data-m="cm">🛢 商品</button></div>
  <form id="sf" role="search"><input id="si" placeholder="搜代码：CND 或 600519" maxlength="6" autocomplete="off" aria-label="搜索股票代码"></form>
  <div class="idx num" id="idx"></div>
  <div class="hb"><span class="mu" id="breadth"></span><button class="btn" id="aib" style="color:#C9A0FF;border-color:rgba(164,75,255,.6)">🤖 问 AI</button><button class="btn" id="nwb" style="color:#FFD23F;border-color:rgba(255,210,63,.55)" title="经济、市场大事：发生了什么、为什么、对股市有什么影响">📰 新闻</button><button class="btn" id="rcb" style="color:#19FF9C;border-color:rgba(25,255,156,.5)">🔬 研究中心</button><a class="btn" href="/report.html" target="_blank">完整报告</a><a class="btn" href="/classic.html">经典版</a><span class="mu" id="src" style="font-size:15px"></span></div>
</header>
<main>
  <aside>
    <div class="tabs" id="ltabs"><button data-t="watch" class="on">自选</button><button data-t="gain">涨幅</button><button data-t="lose">跌幅</button><button data-t="sig">信号</button></div>
    <div class="list" id="list"></div>
    <form class="add" id="addf"><input id="addi" placeholder="加自选，如 BHP" maxlength="6" aria-label="添加自选股"><button class="btn">添加</button></form>
  </aside>
  <section id="center">
    <div class="sym">
