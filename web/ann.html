<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcement</title>
<style>
:root{--bg:#05060C;--p:#0A0D18;--ln:#161D35;--ink:#E6ECFF;--mu:#8590B8;--c:#22E4F5;--y:#FFD43B;--dn:#FF2E74}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Segoe UI",system-ui,sans-serif}
.bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--p);border-bottom:1px solid var(--ln);z-index:2;flex-wrap:wrap}
.bar b{font-family:"JetBrains Mono",monospace;color:var(--c)}
button,a.b{all:unset;cursor:pointer;padding:5px 12px;border:1px solid #222B4D;border-radius:6px;color:var(--mu);font-size:13px}
button:hover,a.b:hover{color:var(--ink);border-color:var(--c)}button.main{color:#03050A;background:var(--c);border-color:var(--c);font-weight:600}
.wrap{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:20px;line-height:1.4;margin:6px 0 4px}.meta{color:var(--mu);font-size:13px}
pre{white-space:pre-wrap;font:inherit;margin:0}
#en p{margin:0 0 12px}.zh{background:#0B1022;border:1px solid #1C2650;border-radius:10px;padding:16px 18px;margin:14px 0}
.note{color:var(--mu);font-size:13px}.err{color:var(--dn)}
</style>
</head>
<body>
<div class="bar"><b id="code"></b><span id="date" class="note"></span>
<button class="main" id="tr" translate="no">AI 翻译成中文</button>
<button id="gt" translate="no">免费翻译说明</button>
<a class="b" id="pdf" target="_blank" translate="no">打开原始 PDF</a>
<span id="msg" class="note" translate="no"></span></div>
<div class="wrap">
<h1 id="hl">Loading…</h1><div class="meta" id="meta"></div>
<div id="zh" class="zh" lang="zh-CN" translate="no" style="display:none"></div>
<div id="en"></div>
</div>
<script>
var $=function(i){return document.getElementById(i);},P=new URLSearchParams(location.search),code=P.get('code'),ids=P.get('ids');
async function api(p){var r=await fetch('/api/'+p);var j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j.data;}
$('code').textContent=code;
api('anntext?code='+encodeURIComponent(code)+'&ids='+encodeURIComponent(ids)).then(function(d){
  $('hl').textContent=d.headline;$('date').textContent=d.date;$('meta').textContent=d.pages+' pages';var en=$('en');en.innerHTML='';(d.text||'(No text could be extracted - open the PDF)').split(/\n\s*\n|\n(?=[A-Z0-9•\-])/).forEach(function(t){t=t.replace(/\s*\n\s*/g,' ').trim();if(!t)return;var p=document.createElement('p');p.textContent=t;en.appendChild(p);});$('pdf').href=d.pdf;document.title=code+' · '+d.headline;
}).catch(function(e){$('hl').textContent='读取失败：'+e.message;});
$('tr').onclick=async function(){$('msg').textContent='翻译中，长公告大约需要 30–60 秒…';$('tr').disabled=true;
  try{var d=await api('anntr?code='+encodeURIComponent(code)+'&ids='+encodeURIComponent(ids));$('zh').style.display='';$('zh').innerHTML='';var pre=document.createElement('pre');pre.textContent=d.zh;$('zh').appendChild(pre);
    $('msg').textContent=d.cached?'已从缓存读取，未再收费':'完成 · 用了 '+(d.tokens_in||0)+' + '+(d.tokens_out||0)+' token'+(d.truncated?' · 公告太长，只翻译了前面约 3 万字':'');window.scrollTo(0,0);}
  catch(e){$('msg').innerHTML='<span class="err">'+e.message+'</span>';}$('tr').disabled=false;};
$('gt').onclick=function(){$('msg').textContent='免费方法：点地址栏右边的翻译图标 → 选中文，并勾选「一律翻译英语」。以后点开任何公告都会自动变成中文。';};
</script>
</body>
</html>
