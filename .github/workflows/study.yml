name: market-study
on:
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/run-study']
permissions:
  contents: write
concurrency: market-study
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/eod
          key: eod-${{ github.run_id }}
          restore-keys: eod-
      - run: pip install numpy pandas scipy arch lightgbm
      - id: mode
        run: |
          echo "mode=$(cat .github/run-study)" >> $GITHUB_OUTPUT
          mkdir -p out
          git fetch -q origin results && git --work-tree=out checkout origin/results -- . || true
          git reset -q
      - name: Run selected rounds
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          MODE="$(cat .github/run-study)"
          ROUNDS=$(echo "$MODE" | grep -oP '(?<=rounds=)[0-9,]+' || echo "1,2,3,4,5,6,7,8,9")
          if [ "${{ github.event_name }}" = "schedule" ]; then ROUNDS=22,61; fi
          for n in $(echo "$ROUNDS" | tr ',' ' '); do
            if [ "$n" = "1" ]; then f=study.py; v=STUDY_OUT; o=study_results.json; else f=study$n.py; v=STUDY${n}_OUT; o=study${n}_results.json; fi
            echo "=== round $n"; env $v=out/$o python $f || echo "round $n failed"
          done
      - name: Publish results to the results branch
        run: |
          cd out
          git init -q -b results
          git config user.name "asx-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add *.json
          git commit -q -m "Study results $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results
