name: market-study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-study']
permissions:
  contents: write
concurrency: market-study
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/eod
          key: eod-${{ github.run_id }}
          restore-keys: eod-
      - run: pip install numpy
      - id: mode
        run: |
          echo "mode=$(cat .github/run-study)" >> $GITHUB_OUTPUT
          mkdir -p out
          git fetch -q origin results && git --work-tree=out checkout origin/results -- . || true
          git reset -q
      - name: Run round 4 (macro)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY4_OUT: out/study4_results.json
        run: python study4.py
      - name: Run round 5 (ETF rules)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY5_OUT: out/study5_results.json
        run: python study5.py
      - name: Run round 6
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY6_OUT: out/study6_results.json
        run: python study6.py
      - name: Run study
        if: ${{ !contains(steps.mode.outputs.mode, 'only4') }}
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY_OUT: out/study_results.json
        run: python study.py
      - name: Run round 2
        if: ${{ !contains(steps.mode.outputs.mode, 'only4') }}
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY2_OUT: out/study2_results.json
        run: python study2.py
      - name: Run round 3
        if: ${{ !contains(steps.mode.outputs.mode, 'only4') }}
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          STUDY3_OUT: out/study3_results.json
        run: python study3.py
      - name: Publish results to the results branch
        run: |
          cd out
          git init -q -b results
          git config user.name "asx-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add *.json
          git commit -q -m "Study results $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results
