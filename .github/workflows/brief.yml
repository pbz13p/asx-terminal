name: brief
# docs/brief.md = short status snapshot every scheduled task reads first (Frank 2026-11-26). Pure code, no API.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/brief.md"]
  schedule:
    - cron: "17 19 * * *"   # daily ~06:17 Melbourne
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: brief, cancel-in-progress: false }
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 300 }
      - name: Make brief
        run: TZ=Australia/Melbourne python3 tools/make_brief.py
      - name: Commit if changed
        run: |
          git config user.name "pbz13p"; git config user.email "pbz13p@users.noreply.github.com"
          git add docs/brief.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "状态快照自动更新：$(TZ=Australia/Melbourne date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
