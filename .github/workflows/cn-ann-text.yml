name: cn-ann-text
# Full text of important A-share announcements (cn_ann_text.py), newest first.
# Eight shards run side by side (each takes every 8th stock, own cache; 2026-11-16: full text is CPU-heavy); restarts itself until done, then daily.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 12 * * *'
  push:
    branches: [main]
    paths: ['cn_ann_text.py', '.github/workflows/cn-ann-text.yml']
permissions:
  contents: read
  actions: write
concurrency: cn-ann-text
jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        include:   # shards 4-7 start from the old 4-shard cache that held their stocks
          - {shard: 0, base: 0}
          - {shard: 1, base: 1}
          - {shard: 2, base: 2}
          - {shard: 3, base: 3}
          - {shard: 4, base: 0}
          - {shard: 5, base: 1}
          - {shard: 6, base: 2}
          - {shard: 7, base: 3}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_ann
          key: cnann-none
          restore-keys: cnann-
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_ann_text
          key: cnanntext-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            cnanntext-s${{ matrix.shard }}-
            cnanntext-s${{ matrix.base }}-
            cnanntext-
      - run: pip install pypdf
      - run: python cn_ann_text.py
        env:
          CNTXT_SHARD: ${{ matrix.shard }}/8
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cn_ann_text
          key: cnanntext-s${{ matrix.shard }}-${{ github.run_id }}
      - if: always()
        run: mkdir -p left && cp data/.cn_ann_text_left left/${{ matrix.shard }} 2>/dev/null || echo 0 > left/${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: left-${{ matrix.shard }}
          path: left/
  big:   # PDFs over 25 MB (big reorganisation reports etc.): one at a time with pdftotext, low memory, own cache
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q poppler-utils
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_ann
          key: cnann-none
          restore-keys: cnann-
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_ann_big
          key: cnannbig-${{ github.run_id }}
          restore-keys: cnannbig-
      - run: python cn_ann_text.py
        env:
          CNTXT_MODE: big
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cn_ann_big
          key: cnannbig-${{ github.run_id }}
      - if: always()
        run: mkdir -p left && cp data/.cn_ann_big_left left/big 2>/dev/null || echo 0 > left/big
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: left-big
          path: left/
  continue:
    needs: [text, big]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: left
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(for f in left/*/*; do cat "$f"; echo; done 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "left: $LEFT"
          if [ "$LEFT" -gt 0 ]; then gh workflow run cn-ann-text.yml --ref main -R ${{ github.repository }}; fi
