name: commodity-probe
on:
  push:
    branches: [main]
    paths: ['commodity_probe.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python commodity_probe.py
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
