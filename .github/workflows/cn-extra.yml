name: cn-extra
# A-share financial statements (East Money, one job) and industry classes + daily valuation / turnover (Baostock,
# 8 jobs side by side, each every 8th stock, own cache). Restarts itself until the history is complete, then daily.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
  push:
    branches: [main]
    paths: ['cn_extra.py', '.github/workflows/cn-extra.yml']
permissions:
  contents: read
  actions: write
concurrency: cn-extra
jobs:
  fin:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_fin
          key: cnfin-${{ github.run_id }}
          restore-keys: cnfin-
      - run: pip install pandas
      - run: python cn_extra.py
        env:
          CNX_PART: fin
          CNX_MINUTES: "180"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cn_fin
          key: cnfin-${{ github.run_id }}
  val:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/cn_val
          key: cnval-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            cnval-s${{ matrix.shard }}-
            cnval-
      - run: pip install baostock pandas
      - run: python cn_extra.py
        env:
          CNX_PART: val
          CNX_MINUTES: "170"
          CNX_SHARD: ${{ matrix.shard }}/8
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cn_val
          key: cnval-s${{ matrix.shard }}-${{ github.run_id }}
      - if: always()
        run: mkdir -p left && cp data/cn_val/.left left/${{ matrix.shard }} 2>/dev/null || echo 0 > left/${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: left-${{ matrix.shard }}
          path: left/
  continue:
    needs: [fin, val]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: left
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(for f in left/*/*; do cat "$f"; echo; done 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "stocks left: $LEFT"
          if [ "$LEFT" -gt 0 ]; then gh workflow run cn-extra.yml --ref main -R ${{ github.repository }}; fi
