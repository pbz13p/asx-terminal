name: quick-study
# Runs single research rounds on the cached price data without touching the results branch or the
# announcement download (which has its own workflow and concurrency group). Output is encrypted and
# pushed to the quick-results branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-quick']
permissions:
  contents: write
  actions: write
concurrency: quick-study
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/eod
          key: eod-none
          restore-keys: eod-
      - uses: actions/cache/restore@v4
        with:
          path: data/ann
          key: ann-none
          restore-keys: ann-
      - uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann-s0-}
      - uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann-s1-}
      - uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann3-s0-}
      - uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann3-s1-}
      - uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann3-s2-}
      - uses: actions/cache@v4
        with:
          path: data/ai
          key: ai-${{ github.run_id }}
          restore-keys: ai-
      - uses: actions/cache@v4
        with:
          path: data/cn
          key: cn-${{ github.run_id }}
          restore-keys: cn-
      - uses: actions/cache@v4      # round 81 announcement embeddings (free local model), per announcement id
        with:
          path: data/emb81
          key: emb81-${{ github.run_id }}
          restore-keys: emb81-
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s0-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s1-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s2-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s3-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s4-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s5-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s6-}}
      - {uses: actions/cache/restore@v4, with: {path: data/emb81, key: emb81-none, restore-keys: emb81-s7-}}
      - run: pip install numpy pandas scipy lightgbm bottleneck && (grep -q "rounds=.*78" .github/run-quick && pip install torch --index-url https://download.pytorch.org/whl/cpu || true) && (grep -q "rounds=.*81" .github/run-quick && pip install scikit-learn fastembed || true)
      - name: Run rounds
        env:
          ASX_DATA_KEY: ${{ secrets.ASX_DATA_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMB_MINUTES: "10"   # round 81 vectors are computed by the 8-lane emb81 workflow; here only top up a few
        run: |
          ls data/eod | wc -l
          mkdir -p out
          if grep -q "cn" .github/run-quick; then STUDYCN_OUT=out/cn_download_summary.json python cn_download.py || echo "cn download failed"; fi
          ROUNDS=$(grep -oP '(?<=rounds=)[0-9,]+' .github/run-quick || true)
          for kv in $(grep -oP 'S76_[A-Z_]+=[^ ]+' .github/run-quick || true); do export "$kv"; done   # round 76 options
          for n in $(echo "$ROUNDS" | tr ',' ' '); do
            echo "=== round $n"; env STUDY${n}_OUT=out/study${n}_results.json python study$n.py || echo "round $n failed"
          done
          if [ -f out/study81_results.json ] && python -c "import json,sys;sys.exit(0 if json.load(open('out/study81_results.json')).get('left_to_embed',0)>0 else 1)"; then echo "round 81 embeddings unfinished: run again"; echo "EMB_AGAIN=1" >> $GITHUB_ENV; fi
          python securedata.py encrypt-dir out
          ls -la out
      - name: Push encrypted results to the quick-results branch
        run: |
          cd out
          git init -q -b quick-results
          git config user.name "asx-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" quick-results && git reset -q --soft FETCH_HEAD || true
          git add -A .
          git commit -q -m "Quick results $(date -u +%FT%T)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:quick-results
      - name: "Round 81 embeddings unfinished: hand over to the 8-lane emb81 workflow"
        if: env.EMB_AGAIN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run emb81.yml --ref main -R ${{ github.repository }}
