name: ann-download
# ASX announcements (study68.py): listing + full text of every announcement for the 1,497-company universe.
# Three jobs side by side (each every 3rd company, own cache "ann3-s<k>"); restarts itself until done, then daily top-up.
# 3 lanes (12 requests at a time) since 2 lanes saw no 403/429 at all (2026-11-16); brakes stop a run on refusals.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1-5'
  push:
    branches: [main]
    paths: ['study68.py', 'study67.py', '.github/workflows/ann-download.yml']
permissions:
  contents: read
  actions: write
concurrency: ann-download
jobs:
  ann:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/eod
          key: eod-none
          restore-keys: eod-
      - id: own
        uses: actions/cache/restore@v4
        with:
          path: data/ann
          key: ann3-s${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: ann3-s${{ matrix.shard }}-
      - if: steps.own.outputs.cache-matched-key == ''   # first 3-lane run: merge both old 2-lane caches, then study68 keeps only this shard's companies
        uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann-s0-}
      - if: steps.own.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with: {path: data/ann, key: ann-none, restore-keys: ann-s1-}
      - run: pip install numpy pandas scipy arch pypdf
      - run: mkdir -p out && python study68.py
        env:
          ANN_SHARD: ${{ matrix.shard }}/3
          ANN_MINUTES: "230"
          STUDY68_OUT: out/study68_s${{ matrix.shard }}.json
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/ann
          key: ann3-s${{ matrix.shard }}-${{ github.run_id }}
      - if: always()
        run: |
          mkdir -p left
          cp data/.ann_left left/${{ matrix.shard }} 2>/dev/null || echo 0 > left/${{ matrix.shard }}
          cp data/.ann_brake left/brake-${{ matrix.shard }} 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: left-${{ matrix.shard }}
          path: left/
  continue:
    needs: ann
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: left
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(for f in left/*/[0-9]*; do cat "$f"; echo; done 2>/dev/null | awk '{s+=$1} END{print s+0}')
          BRAKE=$(for f in left/*/brake-*; do cat "$f"; echo; done 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "announcements left: $LEFT, braked shards: $BRAKE"
          if [ "$BRAKE" -gt 0 ]; then echo "ASX was refusing us: waiting an hour before the next run"; sleep 3600; fi
          if [ "$LEFT" -gt 0 ]; then gh workflow run ann-download.yml --ref main -R ${{ github.repository }}; fi
