name: crypto-data
# Round 86: crypto perpetual futures data (Binance public bulk files, data.binance.vision). Daily top-up.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'
  push:
    branches: [main]
    paths: ['crypto_download.py', '.github/workflows/crypto.yml']
permissions:
  contents: write
  actions: write
concurrency: crypto-data
jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/crypto
          key: crypto-${{ github.run_id }}
          restore-keys: crypto-
      - run: python crypto_download.py
      - uses: actions/cache/save@v4   # keep what was downloaded even if the run fails part-way
        if: always()
        with:
          path: data/crypto
          key: crypto-${{ github.run_id }}
      - name: Not finished -- run again
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ "$(cat crypto_left.txt 2>/dev/null || echo 0)" -gt 0 ]; then gh workflow run crypto.yml --ref main -R ${{ github.repository }}; fi
      - name: Weekly liquidation table for the order preview (round 104; Mondays or by hand)
        env:
          ASX_DATA_KEY: ${{ secrets.ASX_DATA_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "not Monday"; exit 0; fi
          pip install -q numpy cryptography
          mkdir -p out && CRYPTO_RISK_OUT=out/crypto_risk.json python crypto_risk.py
          python securedata.py encrypt-dir out
          cd out && git init -q -b quick-results && git config user.name "asx-study-bot" && git config user.email "actions@users.noreply.github.com"
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" quick-results && git reset -q FETCH_HEAD || true
          git add -- $(ls *.enc) && git commit -q -m "Crypto liquidation table $(date -u +%F)" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:quick-results
