name: cn-announcements
# Builds the China A-share announcement index from cninfo, resumable; restarts itself until every stock is done.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-cnann']
permissions:
  contents: read
  actions: write
concurrency: cn-announcements
jobs:
  ann:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/cn
          key: cn-none
          restore-keys: cn-
      - uses: actions/cache@v4
        with:
          path: data/cn_ann
          key: cnann-${{ github.run_id }}
          restore-keys: cnann-
      - name: Download announcement lists
        run: python cn_ann.py
      - name: Continue if unfinished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(cat data/.cn_ann_left 2>/dev/null || echo 0)
          NEW=$(ls data/cn_ann 2>/dev/null | wc -l)
          echo "left: $LEFT, files: $NEW"
          if [ "$LEFT" -gt 0 ] && [ "$NEW" -gt 0 ]; then gh workflow run cn-ann.yml --ref main; fi
